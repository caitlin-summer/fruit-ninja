<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CFC6FF">
<title>Word Slice – Chém chữ học tiếng Anh</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2E2A4A;--muted:#8A86A8;--violet:#8B7BFF;--pink:#FF6FA8;--mint:#2BC4A8;--soft:#F3F1FF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Lexend',system-ui,sans-serif;overflow:hidden;background:#D9CCFF;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;z-index:1;cursor:crosshair}
.hidden{display:none!important}

/* ---------- Thanh trên cùng ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;overflow:hidden;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:0 0 28px 28px;box-shadow:0 10px 32px rgba(90,70,160,.16);
  display:grid;grid-template-columns:1fr auto;grid-template-areas:"stats ctrl" "word word";gap:10px;align-items:center}
@media(min-width:720px){#hud{grid-template-columns:1fr minmax(300px,400px) 1fr;grid-template-areas:"stats word ctrl"}}
.stats{grid-area:stats;display:flex;gap:8px}
.stat{background:var(--soft);border-radius:14px;padding:6px 12px;line-height:1;min-width:58px}
.stat small{display:block;font-size:10px;font-weight:600;letter-spacing:.09em;color:var(--muted);margin-bottom:3px}
.stat b{font-size:20px;font-weight:800}
.stat b.warn{color:#E5384F}
.ctrl{grid-area:ctrl;display:flex;gap:8px;align-items:center;justify-self:end}
#lives{display:flex;gap:2px;margin-right:2px}
.hr{color:#FF6F8E;font-size:22px;line-height:1;transition:.2s}
.hr.lost{color:#DEDAF0}
.ib{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.12s}
.ib:hover{background:#E9E5FF}
.ib:active{transform:scale(.9)}
#wc{grid-area:word;display:flex;align-items:center;gap:12px;min-height:62px;padding:7px 8px 7px 12px;border-radius:22px;
  background:linear-gradient(120deg,#F3EEFF,#FFEEF5);border:1.5px solid rgba(139,123,255,.12)}
#wimg{width:48px;height:48px;flex:none;filter:drop-shadow(0 4px 6px rgba(90,70,160,.25))}
#wc .t{flex:1;min-width:0;line-height:1.2}
#wc .w{font-size:24px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wc .v{font-size:13px;font-weight:600;color:var(--violet)}
#wc.empty .w{font-size:16px;color:var(--muted);font-weight:600}
#wc.empty .v{color:#B4B0CE;font-weight:500}
#wc.pop .t,#wc.pop #wimg{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:.2}}
#say{background:#fff;box-shadow:0 2px 8px rgba(90,70,160,.14)}
#tbar{position:absolute;left:0;bottom:0;height:4px;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--violet),var(--pink))}

/* ---------- Menu & kết thúc ---------- */
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.panel{width:100%;max-width:580px;margin:auto;text-align:center;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid rgba(255,255,255,.9);border-radius:34px;padding:30px 22px 24px;box-shadow:0 28px 70px rgba(90,70,160,.22);animation:rise .45s cubic-bezier(.2,1,.3,1)}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}}
.logo{font-size:clamp(38px,10vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1;
  background:linear-gradient(90deg,var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-weight:500;font-size:15px;margin:10px 0 20px}
.seg{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:2px;background:#EEEBFF;border-radius:24px;padding:4px;margin-bottom:20px}
.chip{border:0;background:transparent;color:var(--muted);font:600 14px Lexend;padding:8px 13px;border-radius:99px;cursor:pointer;transition:.15s}
.chip.on{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(90,70,160,.16)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px}
.card{background:#fff;border-radius:24px;padding:18px 12px 16px;cursor:pointer;border:2px solid transparent;box-shadow:0 6px 20px rgba(90,70,160,.1);transition:.18s}
.card:hover{transform:translateY(-4px);border-color:var(--d)}
.card:active{transform:scale(.97)}
.card i{display:grid;place-items:center;width:54px;height:54px;border-radius:20px;margin:0 auto 10px;font-size:27px;font-style:normal;background:var(--c)}
.card b{display:block;font-size:15px;font-weight:800}
.card small{display:block;margin-top:3px;font-size:12px;font-weight:500;color:var(--muted);line-height:1.35}
.best{margin-top:18px;font-size:13px;font-weight:600;color:var(--muted);min-height:18px}
.btn{border:0;border-radius:18px;padding:13px 26px;font:700 16px Lexend;color:#fff;cursor:pointer;margin:4px;
  background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 8px 20px rgba(139,123,255,.38);transition:.12s}
.btn:active{transform:scale(.96)}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:none}
.over-h{font-size:26px;font-weight:800}
#nb{display:inline-block;margin-top:8px;background:#FFF1C9;color:#9A6A00;font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px}
#fs{font-size:64px;font-weight:800;line-height:1.1;margin:8px 0 2px;background:linear-gradient(90deg,var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.cap{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 8px}
.learned{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:160px;overflow:auto;margin-bottom:16px;padding:2px}
.learned button{border:0;background:#EEEBFF;color:#6A58E0;border-radius:99px;padding:6px 13px;font:600 14px Lexend;cursor:pointer}
.learned button:active{transform:scale(.95)}
.learned span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<header id="hud" class="hidden">
  <div class="stats">
    <div class="stat"><small>ĐIỂM</small><b id="score">0</b></div>
    <div class="stat"><small>TỪ</small><b id="nw">0</b></div>
  </div>
  <div id="wc" class="empty">
    <img id="wimg" class="hidden" alt="">
    <div class="t"><div class="w" id="ww">Chém để học từ mới</div><div class="v" id="wv">Nghe và đọc theo nhé</div></div>
    <button class="ib" id="say" aria-label="Nghe lại">🔊</button>
  </div>
  <div class="ctrl">
    <div id="lives"></div>
    <div class="stat hidden" id="tstat"><small>GIÂY</small><b id="tv">30</b></div>
    <button class="ib" id="snd" aria-label="Bật/tắt âm">🔊</button>
    <button class="ib" id="stop" aria-label="Kết thúc">✕</button>
  </div>
  <div id="tbar" class="hidden"></div>
</header>

<div id="menu" class="ov"><div class="panel">
  <div class="logo">Word Slice</div>
  <p class="sub" id="subt">Chém vật thể, nghe phát âm, học từ tiếng Anh</p>
  <div class="seg" id="chips"></div>
  <div class="modes">
    <div class="card" style="--c:#D8F6EF;--d:#6FD9C0" data-m="practice"><i>🌱</i><b>Luyện tập</b><small>Không bom, không mất mạng</small></div>
    <div class="card" style="--c:#FFE0EC;--d:#FF8FB8" data-m="classic"><i>🎮</i><b>Cổ điển</b><small>3 mạng, tránh quả bom</small></div>
    <div class="card" style="--c:#E6E0FF;--d:#A592FF" data-m="timed"><i>⏱️</i><b>30 giây</b><small>Chém thật nhiều</small></div>
  </div>
  <p class="best" id="best"></p>
</div></div>

<div id="over" class="ov hidden"><div class="panel">
  <div class="over-h">Kết thúc!</div>
  <div id="nb" class="hidden">🏆 Kỷ lục mới</div>
  <div id="fs">0</div>
  <p class="cap">Từ vựng đã chém · bấm để nghe lại</p>
  <div class="learned" id="learned"></div>
  <button class="btn" id="again">Chơi lại</button>
  <button class="btn alt" id="home">Trang chủ</button>
</div></div>

<script>
const $=id=>document.getElementById(id);

/* ================= ĐỒ HOẠ: sticker pastel kawaii ================= */
const GR={
  red:['#FF9DB0','#FF5C7C'], pinkL:['#FFD3E1','#FF9DBE'], orange:['#FFCB85','#FF9340'], gold:['#FFE08A','#FFAE3D'],
  yellow:['#FFF0A0','#FFD54A'], lime:['#CDF59A','#8EDB5B'], green:['#97E8B0','#4FC27E'], mint:['#BDF3E5','#6FD9C0'],
  sky:['#B4E8FF','#6CC3F5'], blue:['#A8C0FF','#6D8DF2'], purple:['#DDC4FF','#A97DF0'], lilac:['#EBDDFF','#C7A6F7'],
  brown:['#DDB48C','#B07D55'], cocoa:['#B57A62','#7E4C3C'], tan:['#FFE0B8','#F2B877'], cream:['#FFF8E6','#FFE6B3'],
  white:['#FFFFFF','#E4E9FA'], gray:['#DADFEE','#AEB6CF'], dark:['#6F7390','#3C3F58'], peach:['#FFD9C4','#FFA38F'],
  cookie:['#EBC089','#CE9455'], crust:['#F8CC90','#E6A056'], tennis:['#EEF98A','#C6E03F']
};
const DEFS='<defs>'+Object.entries(GR).map(([n,[a,b]])=>`<linearGradient id="${n}" x1=".2" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`).join('')+'</defs>';
const INK='#3B2F4A';
const HL=(x,y,rx,ry,r=-30,o=.55)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" opacity="${o}" transform="rotate(${r} ${x} ${y})"/>`;
const CP=(cx,cy,r)=>`M${cx-r} ${cy}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0z`;
// Mặt kawaii: m=0 cười, 1 há miệng, 2 mèo (ω), 3 không miệng
const FACE=(x,y,s=1,m=0)=>{
  const e=9*s,r=3.4*s;
  const eye=cx=>`<circle cx="${cx}" cy="${y}" r="${r}" fill="${INK}"/><circle cx="${cx-r*.3}" cy="${y-r*.35}" r="${r*.4}" fill="#fff"/>`;
  const bl=cx=>`<ellipse cx="${cx}" cy="${y+4.6*s}" rx="${4.6*s}" ry="${2.8*s}" fill="#FF7FA1" opacity=".55"/>`;
  let mo='';
  if(m===0)mo=`<path d="M${x-4*s} ${y+4*s}q${4*s} ${4.6*s} ${8*s} 0" fill="none" stroke="${INK}" stroke-width="${1.9*s}" stroke-linecap="round"/>`;
  else if(m===1)mo=`<ellipse cx="${x}" cy="${y+6*s}" rx="${2.6*s}" ry="${3.2*s}" fill="#C2476B"/>`;
  else if(m===2)mo=`<path d="M${x-5*s} ${y+4*s}q${2.5*s} ${3.6*s} ${5*s} 0q${2.5*s} ${3.6*s} ${5*s} 0" fill="none" stroke="${INK}" stroke-width="${1.9*s}" stroke-linecap="round"/>`;
  return bl(x-e-5.5*s)+bl(x+e+5.5*s)+eye(x-e)+eye(x+e)+mo;
};
const SZ=256,PAD=16,OUT=7,SC=SZ/(SZ-2*PAD);
function sticker(img){
  const c=document.createElement('canvas');c.width=c.height=SZ;const x=c.getContext('2d');
  const t=document.createElement('canvas');t.width=t.height=SZ;const tx=t.getContext('2d');
  tx.drawImage(img,PAD,PAD,SZ-2*PAD,SZ-2*PAD);tx.globalCompositeOperation='source-in';tx.fillStyle='#fff';tx.fillRect(0,0,SZ,SZ);
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2;x.drawImage(t,Math.cos(a)*OUT,Math.sin(a)*OUT)}
  x.drawImage(img,PAD,PAD,SZ-2*PAD,SZ-2*PAD);return c;
}
function mk(s){
  const o={img:new Image(),cv:null};
  o.img.onload=()=>{try{o.cv=sticker(o.img)}catch(e){}};
  o.img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" stroke-linejoin="round" stroke-linecap="round">'+DEFS+s+'</svg>');
  o.src=o.img.src;return o;
}

const grapes=[[32,46,14],[58,42,14],[74,54,12],[42,66,14],[64,68,13],[52,86,11]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#purple)"/>`+HL(x-4,y-5,3,4.5,20,.6)).join('');
const hatch=[0,1,2,3,4,5,6].map(k=>`<path d="M${22+k*9} 30l40 70M${78-k*9} 30l-40 70" stroke="#E08A00" stroke-width="2" opacity=".22" fill="none"/>`).join('');
const seeds=[[38,48],[62,46],[30,62],[70,62],[40,76],[60,76],[50,84]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="1.8" ry="2.8" fill="#FFF3B0"/>`).join('');
const petals=[0,1,2,3,4,5].map(i=>{const a=i*Math.PI/3-Math.PI/2;return `<circle cx="${50+Math.cos(a)*27}" cy="${50+Math.sin(a)*27}" r="17" fill="url(#pinkL)"/>`}).join('');
const rays=[0,1,2,3,4,5,6,7].map(i=>`<path d="M-6 -34L0 -48L6 -34z" fill="#FFC94D" stroke="#FFC94D" stroke-width="4" transform="translate(50 50) rotate(${i*45})"/>`).join('');
const scallop='q-7 9 -14 0 '.repeat(6);

// [loại, từ, nghĩa, SVG, màu nước ép]
const I=[
/* ---- Trái cây ---- */
['f','apple','quả táo','<path d="M50 30C26 16 8 36 12 60c4 22 20 32 38 26 18 6 34-4 38-26C92 36 74 16 50 30z" fill="url(#red)"/><path d="M50 30Q50 18 55 10" fill="none" stroke="#8A5A3C" stroke-width="4"/><path d="M56 20Q70 6 84 16Q70 30 56 20z" fill="url(#lime)"/>'+HL(27,44,5,10,20)+FACE(50,60),'#FF6B88'],
['f','banana','chuối','<path d="M12 58C14 84 46 96 72 82C90 70 96 44 84 20L70 24C74 46 64 62 46 66C34 68 26 58 24 44Z" fill="url(#yellow)"/><path d="M84 20l-2-10 10-2 2 12z" fill="#8A5A3C"/><circle cx="18" cy="52" r="5" fill="#8A5A3C"/>'+HL(36,72,10,3,22,.5)+FACE(52,78,.62),'#FFD54A'],
['f','orange','quả cam','<circle cx="50" cy="56" r="38" fill="url(#orange)"/><path d="M50 22Q58 8 76 12Q68 28 50 22z" fill="url(#lime)"/>'+HL(30,40,6,12,35)+FACE(50,60),'#FFA94D'],
['f','watermelon','dưa hấu','<g transform="translate(0,-10)"><path d="M6 40A44 44 0 0 0 94 40z" fill="url(#green)"/><path d="M11 40A39 39 0 0 0 89 40z" fill="#F4FBE3"/><path d="M15 40A35 35 0 0 0 85 40z" fill="url(#red)"/><g fill="'+INK+'"><ellipse cx="28" cy="50" rx="2.4" ry="4" transform="rotate(-25 28 50)"/><ellipse cx="72" cy="50" rx="2.4" ry="4" transform="rotate(25 72 50)"/><ellipse cx="40" cy="47" rx="2.4" ry="4"/><ellipse cx="60" cy="47" rx="2.4" ry="4"/></g>'+FACE(50,62,.9)+'</g>','#FF5C7C'],
['f','strawberry','dâu tây','<path d="M50 92C22 76 10 48 22 36c10-10 46-10 56 0 12 12 0 40-28 56z" fill="url(#red)"/>'+seeds+'<path d="M50 32L36 22 28 31 40 33 32 41 46 37 50 45 54 37 68 41 60 33 72 31 64 22z" fill="url(#green)"/>'+HL(30,48,4,9,15)+FACE(50,62,.95),'#FF5C7C'],
['f','grapes','nho','<path d="M52 28Q54 14 66 10" fill="none" stroke="#7A5A3C" stroke-width="4"/><path d="M58 16Q72 4 88 16Q72 26 58 16z" fill="url(#lime)"/>'+grapes+FACE(52,62,.85),'#A97DF0'],
['f','pineapple','quả dứa','<clipPath id="pc"><ellipse cx="50" cy="66" rx="26" ry="31"/></clipPath><path d="M50 38L28 4l16 14L50 0l6 18L72 4z" fill="url(#green)"/><ellipse cx="50" cy="66" rx="26" ry="31" fill="url(#gold)"/><g clip-path="url(#pc)">'+hatch+'</g>'+HL(36,52,4,10,15)+FACE(50,70,.85),'#FFC94D'],
['f','lemon','chanh vàng','<g transform="rotate(-20 50 54)"><ellipse cx="50" cy="54" rx="38" ry="29" fill="url(#yellow)"/><circle cx="11" cy="54" r="6.5" fill="url(#yellow)"/><circle cx="89" cy="54" r="6.5" fill="url(#yellow)"/></g><path d="M66 22Q80 8 92 18Q80 32 66 22z" fill="url(#lime)"/>'+HL(32,42,10,4,-30)+FACE(50,58),'#FFE35A'],
['f','cherry','quả anh đào','<path d="M32 58Q34 30 54 14M68 54Q66 30 54 14" fill="none" stroke="#5FB46A" stroke-width="3.5"/><path d="M54 14Q70 2 84 12Q70 24 54 14z" fill="url(#lime)"/><circle cx="32" cy="72" r="17" fill="url(#red)"/><circle cx="68" cy="68" r="17" fill="url(#red)"/>'+HL(25,64,3.5,6,20)+HL(61,60,3.5,6,20)+FACE(32,74,.7)+FACE(68,70,.7),'#FF5C7C'],
['f','peach','quả đào','<path d="M50 24C20 14 8 44 18 66c8 18 24 22 32 16 8 6 24 2 32-16C92 44 80 14 50 24z" fill="url(#peach)"/><path d="M50 26Q44 52 50 80" fill="none" stroke="#fff" stroke-width="2.5" opacity=".4"/><path d="M52 22Q62 6 80 10Q72 26 52 22z" fill="url(#lime)"/>'+HL(26,44,5,10,20)+FACE(50,56),'#FFA38F'],

/* ---- Động vật ---- */
['a','cat','con mèo','<path d="M14 46L18 10 44 28z" fill="url(#orange)"/><path d="M86 46L82 10 56 28z" fill="url(#orange)"/><path d="M21 36L23 20 36 29z" fill="#FFB8CB"/><path d="M79 36L77 20 64 29z" fill="#FFB8CB"/><ellipse cx="50" cy="58" rx="38" ry="32" fill="url(#orange)"/><path d="M50 28v8M41 30l2 7M59 30l-2 7" stroke="#E27A2E" stroke-width="3" fill="none"/><path d="M8 62l16 3M8 72l16-2M92 62l-16 3M92 72l-16-2" stroke="#E27A2E" stroke-width="2" opacity=".5" fill="none"/>'+FACE(50,60,1.05,2),'#FFA94D'],
['a','dog','con chó','<ellipse cx="16" cy="48" rx="12" ry="24" fill="url(#brown)" transform="rotate(14 16 48)"/><ellipse cx="84" cy="48" rx="12" ry="24" fill="url(#brown)" transform="rotate(-14 84 48)"/><circle cx="50" cy="54" r="34" fill="url(#tan)"/><ellipse cx="50" cy="68" rx="17" ry="12" fill="url(#cream)"/>'+FACE(50,46,1,3)+'<ellipse cx="50" cy="61" rx="7" ry="5" fill="'+INK+'"/><path d="M50 66v4M50 70q-5 5-10 1M50 70q5 5 10 1" fill="none" stroke="'+INK+'" stroke-width="2"/><path d="M46 73Q50 84 54 73z" fill="#FF7F9A"/>','#F2B877'],

    const s=sz(this.it);
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    ctx.shadowColor=this.it.bomb?'rgba(255,90,70,.6)':'rgba(70,50,140,.3)';ctx.shadowBlur=this.it.bomb?24:16;ctx.shadowOffsetY=this.it.bomb?0:8;
    ctx.drawImage(src(this.it),-s/2,-s/2,s,s);ctx.restore();
  }
  slice(a){
    if(this.sliced)return;this.sliced=true;
    const it=this.it,col=it.j;
    if(!it.bomb){
      const px=-Math.sin(a),py=Math.cos(a),k=4+Math.random()*3;
      for(const s of[-1,1])halves.push({x:this.x,y:this.y,vx:this.vx+px*k*s,vy:this.vy+py*k*s-2,rot:this.rot,rv:s*(.06+Math.random()*.08),s,it,o:1});
      rings.push({x:this.x,y:this.y,r:8,o:.8,c:'#fff'});
      splats.push({x:this.x,y:this.y,r:20+Math.random()*12,o:.28,c:col,d:[0,1,2].map(()=>[(Math.random()-.5)*56,(Math.random()-.5)*46,4+Math.random()*8])});
      beep(800,100,.1);streak++;
      let b=0;if(streak>=2){b=(streak-1)*5;beep(600,1200,.2,'sine');texts.push(txt(this.x,this.y-46,'COMBO x'+(streak-1),'#FF8A3D',1))}
      score+=10+b;texts.push(txt(this.x,this.y,'+'+(10+b),'#8B7BFF'));
      say(it.w);showWord(it);
      learned.set(it.w,it);$('nw').textContent=learned.size;
    }else{
      beep(100,40,.3,'sawtooth',.5);shake=18;flash=1;streak=0;
      texts.push(txt(this.x,this.y,'BÙM!','#E5384F',1));
      if(mode==='classic'){lives--;drawLives();if(lives<=0)end()}
      else if(mode==='timed')score=Math.max(0,score-50);
    }
    $('score').textContent=score;
    const pal=[col,'#fff','#FFE066'];
    for(let i=0;i<16;i++)parts.push({x:this.x,y:this.y,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,s:Math.random()*4.5+2,l:1,d:.025+Math.random()*.02,c:pal[i%3]});
  }
}

function showWord(it){
  curWord=it;const wc=$('wc');wc.classList.remove('empty','pop');
  const im=$('wimg');im.src=it.src;im.classList.remove('hidden');
  $('ww').textContent=it.w;$('wv').textContent=it.vi;
  void wc.offsetWidth;wc.classList.add('pop');
}
function resetWord(){
  curWord=null;const wc=$('wc');wc.classList.add('empty');wc.classList.remove('pop');
  $('wimg').classList.add('hidden');$('ww').textContent='Chém để học từ mới';$('wv').textContent='Nghe và đọc theo nhé';
}
function drawLives(){$('lives').innerHTML=[0,1,2].map(i=>`<span class="hr${i<lives?'':' lost'}">♥</span>`).join('')}

/* ================= ĐIỀU KHIỂN ================= */
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;if(!l)return Math.hypot(px-x1,py-y1);const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l));return Math.hypot(px-x1-t*dx,py-y1-t*dy)}
addEventListener('pointerdown',()=>{last=null});
addEventListener('pointerup',()=>{last=null});
addEventListener('pointermove',e=>{if(state==='PLAYING'){moves.push({x:e.clientX,y:e.clientY-topPx});if(moves.length>40)moves.splice(0,moves.length-40)}});
function runMoves(){
  for(const m of moves){
    if(!last){last=m;continue}
    const d=Math.hypot(m.x-last.x,m.y-last.y),n=Math.min(Math.ceil(d/8),20);
    for(let i=1;i<=n;i++)trail.push({x:last.x+(m.x-last.x)*i/n,y:last.y+(m.y-last.y)*i/n,a:0});
    if(d>1){const a=Math.atan2(m.y-last.y,m.x-last.x);
      for(const o of objs)if(!o.sliced&&segDist(o.x,o.y,last.x,last.y,m.x,m.y)<R*.78+14)o.slice(a)}
    last=m;
  }
  moves.length=0;
}

(function spawn(){
  if(state==='PLAYING'){
    const bc=mode==='practice'?0:mode==='classic'?.13:.2;
    objs.push(new Obj(Math.random()<bc));
    if(Math.random()<.25)objs.push(new Obj(Math.random()<bc*.5));
  }
  setTimeout(spawn,700+Math.random()*800);
})();

/* ================= VẼ (nền gọn: gradient pastel + vài đốm sáng mờ) ================= */
const BL=[[.15,.2,.5,[150,235,255],.7],[.88,.15,.45,[255,226,170],.65],[.8,.88,.55,[255,160,205],.55],[.08,.9,.45,[170,255,225],.5]];
const DECO=[[.08,.16],[.9,.12],[.05,.6],[.94,.55],[.18,.88],[.82,.86],[.5,.05],[.36,.95],[.68,.94]];
function drawBG(t){
  const g=ctx.createLinearGradient(0,0,W*.4,H);
  g.addColorStop(0,'#C3CCFF');g.addColorStop(.5,'#E2CFFF');g.addColorStop(1,'#FFD0E2');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const m=Math.max(W,H);
  BL.forEach(([fx,fy,fr,c,a],i)=>{
    const x=fx*W+Math.sin(t/3500+i*1.7)*28,y=fy*H+Math.cos(t/4200+i)*24,r=fr*m;
    const rg=ctx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${a})`);rg.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);
    ctx.fillStyle=rg;ctx.fillRect(x-r,y-r,r*2,r*2);
  });
  for(let i=splats.length-1;i>=0;i--){const s=splats[i];ctx.globalAlpha=Math.max(0,s.o);ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);s.d.forEach(([dx,dy,r])=>{ctx.moveTo(s.x+dx+r,s.y+dy);ctx.arc(s.x+dx,s.y+dy,r,0,7)});ctx.fill();s.o-=.007*K;if(s.o<=0)splats.splice(i,1)}
  ctx.globalAlpha=1;
}
function drawDeco(t){
  DECO.forEach(([fx,fy],i)=>{
    const it=ITEMS[(i*5+2)%ITEMS.length],x=fx*W,y=fy*H+Math.sin(t/800+i*1.7)*10,s=(36+(i%3)*8)*2*(it.cv?SC:1);
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t/1100+i)*.3);
    ctx.shadowColor='rgba(70,50,140,.22)';ctx.shadowBlur=14;ctx.shadowOffsetY=7;
    ctx.drawImage(src(it),-s/2,-s/2,s,s);ctx.restore();
  });
}
function loop(t){
  K=Math.min(2.5,Math.max(.3,(t-prevT)/16.667||1));prevT=t;
  drawBG(t||0);
  ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*9,(Math.random()-.5)*9);shake-=K}
  if(state!=='PLAYING')drawDeco(t||0);
  if(state==='PLAYING'){
    runMoves();
    ctx.lineCap='round';
    for(let i=1;i<trail.length;i++){const p=trail[i-1],q=trail[i];if(Math.hypot(q.x-p.x,q.y-p.y)>60)continue;const f=1-q.a/14;
      ctx.strokeStyle=`rgba(139,123,255,${.3*f})`;ctx.lineWidth=16*f+2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
      ctx.strokeStyle=`rgba(255,255,255,${f})`;ctx.lineWidth=6*f+1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
    trail.forEach(p=>p.a+=K);trail=trail.filter(p=>p.a<14);
    for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=4*K;r.o-=.055*K;ctx.save();ctx.globalAlpha=Math.max(0,r.o);ctx.strokeStyle=r.c;ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();ctx.restore();if(r.o<=0)rings.splice(i,1)}
    for(let i=objs.length-1;i>=0;i--){
      const o=objs[i];if(o.sliced){objs.splice(i,1);continue}
      o.update();o.draw();
      if(o.y>H+R+80&&o.vy>0){
        if(!o.it.bomb){streak=0;texts.push(txt(Math.min(W-40,Math.max(40,o.x)),H-30,'Trượt','#FF9A3D'));
          if(mode==='classic'){lives--;drawLives();if(lives<=0)end()}}
        objs.splice(i,1);
      }
    }
    for(let i=halves.length-1;i>=0;i--){
      const h=halves[i],s=sz(h.it);h.x+=h.vx*K;h.y+=h.vy*K;h.vy+=.45*K;h.rot+=h.rv*K;h.o-=.014*K;
      ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.rot);ctx.globalAlpha=Math.max(0,h.o);
      ctx.beginPath();ctx.rect(h.s<0?-s/2:0,-s/2,s/2,s);ctx.clip();
      ctx.drawImage(src(h.it),-s/2+(h.s<0?4:-4),-s/2,s,s);ctx.restore();
      if(h.o<=0||h.y>H+200)halves.splice(i,1);
    }
    if(parts.length>300)parts.splice(0,parts.length-300);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*K;p.y+=p.vy*K;p.vy+=.4*K;p.l-=p.d*K;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();ctx.globalAlpha=1;if(p.l<=0)parts.splice(i,1)}
    for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=1.8*K;t.l-=.02*K;ctx.save();ctx.globalAlpha=Math.max(0,t.l);ctx.font=`800 ${t.sz}px Lexend, sans-serif`;ctx.textAlign='center';ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle='#fff';ctx.strokeText(t.t,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.t,t.x,t.y);ctx.restore();if(t.l<=0)texts.splice(i,1)}
  }
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,90,90,${flash*.26})`;ctx.fillRect(0,0,W,H);flash-=.06*K}
  requestAnimationFrame(loop);
}

/* ================= LUỒNG GAME ================= */
const best=()=>{try{return JSON.parse(localStorage.getItem('wordslice_best')||'{}')}catch(e){return{}}};
function showBest(){const b=best();$('best').textContent=['classic','timed'].some(m=>b[m])?`🏆 Kỷ lục · Cổ điển ${b.classic||0} · 30 giây ${b.timed||0}`:''}
function start(m){
  mode=m;score=0;lives=3;time=30;objs=[];halves=[];parts=[];texts=[];trail=[];rings=[];moves=[];learned=new Map();streak=0;last=null;flash=0;recent=[];
  ['menu','over'].forEach(i=>$(i).classList.add('hidden'));
  $('hud').classList.remove('hidden');
  state='PLAYING';
  $('score').textContent=0;$('nw').textContent=0;resetWord();
  $('lives').style.display=m==='classic'?'flex':'none';if(m==='classic')drawLives();
  $('tstat').classList.toggle('hidden',m!=='timed');
  $('tbar').classList.toggle('hidden',m!=='timed');
  clearInterval(timer);
  if(m==='timed'){$('tv').textContent=time;$('tv').classList.remove('warn');$('tbar').style.transform='scaleX(1)';
    timer=setInterval(()=>{time--;$('tv').textContent=time;$('tv').classList.toggle('warn',time<=5);$('tbar').style.transform=`scaleX(${Math.max(0,time)/30})`;if(time<=0)end()},1000)}
  rs();beep(400,400,.05,'sine',.1);
}
function end(){
  if(state!=='PLAYING')return;state='OVER';clearInterval(timer);
  let nb=false;
  if(mode!=='practice'){const b=best();if(score>(b[mode]||0)){nb=score>0;b[mode]=score;try{localStorage.setItem('wordslice_best',JSON.stringify(b))}catch(e){}}}
  $('nb').classList.toggle('hidden',!nb);
  $('fs').textContent=score;
  const box=$('learned');box.innerHTML='';
  [...learned.values()].forEach(it=>{const b=document.createElement('button');b.textContent=`${it.w} · ${it.vi}`;b.onclick=()=>say(it.w,true);box.appendChild(b)});
  if(!learned.size){const s=document.createElement('span');s.textContent='Chưa chém được từ nào';box.appendChild(s)}
  $('over').classList.remove('hidden');
  $('hud').classList.add('hidden');rs();
}
function home(){state='MENU';$('over').classList.add('hidden');$('menu').classList.remove('hidden');showBest();rs()}

/* ================= GIAO DIỆN ================= */
const chips=$('chips');
[['all','🌈 Tất cả'],['f','🍓 Trái cây'],['a','🐰 Động vật'],['d','🍩 Đồ ăn'],['t','🎁 Đồ vật'],['n','☀️ Thiên nhiên']].forEach(([k,v])=>{
  const b=document.createElement('button');b.className='chip'+(k==='all'?' on':'');b.textContent=v;
  b.onclick=()=>{cat=k;recent=[];[...chips.children].forEach(c=>c.classList.toggle('on',c===b))};chips.appendChild(b);
});
$('subt').textContent=`Chém vật thể, nghe phát âm, học ${ITEMS.length} từ tiếng Anh`;
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>start(c.dataset.m));
$('again').onclick=()=>start(mode);$('home').onclick=home;$('stop').onclick=end;
$('say').onclick=()=>{if(curWord)say(curWord.w,true)};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';if(!sound)try{speechSynthesis.cancel()}catch(e){}};
showBest();rs();requestAnimationFrame(loop);
</script>
